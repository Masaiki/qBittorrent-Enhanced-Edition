name: CI - Windows
on: [pull_request, push]

jobs:
  ci:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            conan_profile: windows-x64-release
            conan_build_profile: windows-x64-release
            runner: windows-2022
            vcvars: vcvars64.bat
          - arch: arm64
            conan_profile: windows-arm64-release
            conan_build_profile: windows-arm64-release
            runner: windows-11-arm
            vcvars: vcvarsarm64.bat

    env:
      LIBTORRENT_VERSION: "1.2.20"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          choco install ninja
          pip install conan

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ matrix.arch }}-${{ hashFiles('conanfile.txt', 'conan/profiles/*') }}
          restore-keys: |
            conan-${{ matrix.arch }}-

      - name: Install Conan dependencies
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\${{ matrix.vcvars }}"
          conan install . ^
            --profile:host=conan/profiles/${{ matrix.conan_profile }} ^
            --profile:build=conan/profiles/${{ matrix.conan_build_profile }} ^
            --output-folder=build ^
            --build=missing

      - name: Build libtorrent
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\${{ matrix.vcvars }}"
          git clone --depth 1 --branch v%LIBTORRENT_VERSION% https://github.com/arvidn/libtorrent.git libtorrent-src
          cmake -S libtorrent-src -B libtorrent-build -G "Ninja" ^
            -DCMAKE_TOOLCHAIN_FILE=%CD%/build/conan_toolchain.cmake ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DCMAKE_CXX_STANDARD=17 ^
            -DCMAKE_INSTALL_PREFIX=%CD%/libtorrent-install ^
            -Dstatic_runtime=ON ^
            -Ddeprecated-functions=ON
          cmake --build libtorrent-build
          cmake --install libtorrent-build

      - name: Build qBittorrent
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\${{ matrix.vcvars }}"
          cmake ^
            -B build ^
            -G "Ninja" ^
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DCMAKE_EXE_LINKER_FLAGS=Mpr.lib ^
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ^
            -DCMAKE_PREFIX_PATH=%CD%/libtorrent-install ^
            -DMSVC_RUNTIME_DYNAMIC=OFF ^
            -DVERBOSE_CONFIGURE=ON ^
            --graphviz=build/target_graph.dot
          cmake --build build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: qBittorrent-CI_Windows-${{ matrix.arch }}
          path: |
            build/compile_commands.json
            build/qbittorrent.exe
            build/qbittorrent.pdb
            build/target_graph.dot
            dist/windows/qt.conf
