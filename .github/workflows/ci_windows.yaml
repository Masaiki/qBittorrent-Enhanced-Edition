name: CI - Windows
on: [pull_request, push]

jobs:
  ci:
    name: Build
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          choco install ninja

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg environment
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "d5ec528843d29e3a52d745a64b469f810b2cedbf"
          vcpkgDirectory: "C:/vcpkg"

      # tell vcpkg to only build Release variants of the dependencies
      - name: Configure vcpkg triplet overlay
        run: |
          New-Item `
            -Path "${{ github.workspace }}" `
            -Name "triplets_overlay" `
            -ItemType Directory
          Copy-Item `
            "$env:VCPKG_ROOT/triplets/x64-windows-static.cmake" `
            "${{ github.workspace }}/triplets_overlay/x64-windows-static-release.cmake"
          Add-Content `
            "${{ github.workspace }}/triplets_overlay/x64-windows-static-release.cmake" `
            -Value "set(VCPKG_BUILD_TYPE release)"

      # clear buildtrees after each package installation to reduce disk space requirements
      - name: Install dependencies
        run: |
          $packages = `
            "boost-circular-buffer:x64-windows-static-release",
            "libtorrent:x64-windows-static-release",
            "qt5-base:x64-windows-static-release",
            "qt5-svg:x64-windows-static-release",
            "qt5-tools:x64-windows-static-release",
            "qt5-winextras:x64-windows-static-release"
          & "$env:VCPKG_ROOT/vcpkg.exe" upgrade `
            --overlay-ports="${{ github.workspace }}/vcpkg" `
            --overlay-triplets="${{ github.workspace }}/triplets_overlay" `
            --no-dry-run
          & "$env:VCPKG_ROOT/vcpkg.exe" install `
            --overlay-ports="${{ github.workspace }}/vcpkg" `
            --overlay-triplets="${{ github.workspace }}/triplets_overlay" `
            --clean-after-build `
            $packages

      - name: Build qBittorrent
        shell: cmd
        run: |
          set "CI_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set "VCPKG_ROOT=%CI_VCPKG_ROOT%"
          cmake ^
            -B build ^
            -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%/scripts/buildsystems/vcpkg.cmake" ^
            -DMSVC_RUNTIME_DYNAMIC=OFF ^
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-release ^
            -DVERBOSE_CONFIGURE=ON ^
            --graphviz=build/target_graph.dot
          cmake --build build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: qBittorrent-CI_Windows-x64
          path: |
            build/compile_commands.json
            build/qbittorrent.exe
            build/qbittorrent.pdb
            build/target_graph.dot
            dist/windows/qt.conf
