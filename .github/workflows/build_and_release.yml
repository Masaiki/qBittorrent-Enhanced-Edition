on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  release:
    types:
      - released

jobs:
  appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build AppImage
        run: |
          docker run --rm \
            -e GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            -v "${GITHUB_WORKSPACE}:/build" \
            -w /build \
            ubuntu:18.04 \
            bash -lc "apt-get update && apt-get install -y sudo ca-certificates && sudo .github/workflows/build_appimage.sh"
      - uses: actions/upload-artifact@v6
        with:
          name: qBittorrent-Enhanced-Edition.AppImage
          path: |
            .github/workflows/qBittorrent-Enhanced-Edition.AppImage
            .github/workflows/qBittorrent-Enhanced-Edition.AppImage.zsync
      - name: Upload Github Assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            .github/workflows/qBittorrent-Enhanced-Edition.AppImage* \
            --clobber
      - name: Setup tmate session
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 15

  # cross compile for some other platforms, like arm, mips, etc.
  cross-compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # cross toolchain images from: https://hub.docker.com/r/abcfy2/muslcc-toolchain-ubuntu
          # openssl_compiler choose from openssl source directory `./Configure LIST`
          # qt_device choose from https://github.com/qt/qtbase/tree/dev/mkspecs/devices/
          # qt_xplatform choose from https://github.com/qt/qtbase/tree/dev/mkspecs/
          - cross_host: arm-linux-musleabi
            openssl_compiler: linux-armv4
            qt_device: linux-arm-generic-g++
          - cross_host: aarch64-linux-musl
            openssl_compiler: linux-aarch64
            qt_device: linux-arm-generic-g++
          - cross_host: x86_64-linux-musl
            openssl_compiler: linux-x86_64
            qt_device: linux-generic-g++
          # - cross_host: x86_64-w64-mingw32
          #   openssl_compiler: mingw64
          #   qt_xplatform: win32-g++
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: cross compile nox-static
        env:
          CROSS_HOST: "${{ matrix.cross_host }}"
          OPENSSL_COMPILER: "${{ matrix.openssl_compiler }}"
          QT_DEVICE: "${{ matrix.qt_device }}"
          QT_XPLATFORM: "${{matrix.qt_xplatform}}"
        run: |
          docker run --rm \
            -e CROSS_HOST="${CROSS_HOST}" \
            -e OPENSSL_COMPILER="${OPENSSL_COMPILER}" \
            -e QT_DEVICE="${QT_DEVICE}" \
            -e QT_XPLATFORM="${QT_XPLATFORM}" \
            -v "${GITHUB_WORKSPACE}:/build" \
            -w /build \
            "abcfy2/muslcc-toolchain-ubuntu:${CROSS_HOST}" \
            /build/.github/workflows/cross_build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: qbittorrent-nox_${{ matrix.cross_host }}_static
          path: .github/workflows/qbittorrent-nox_${{ matrix.cross_host }}_static.zip
      - name: Upload Github Assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            ".github/workflows/qbittorrent-nox_${{ matrix.cross_host }}_static.zip" \
            --clobber
      - name: Setup tmate session
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 60
