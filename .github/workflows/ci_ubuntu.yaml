name: CI - Ubuntu
on: [pull_request, push]

env:
  VCPKG_COMMIT: 84bab45d415d22042bd0b9081aea57f362da3f35 # 2025.12.12, Qt 5.15.18
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives

jobs:
  ci:
    name: Build
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        include:
          - qbt_gui: "GUI=ON"
            vcpkg_arch: x64
            vcpkg_triplet: x64-linux-release
          - qbt_gui: "GUI=OFF"
            vcpkg_arch: x64
            vcpkg_triplet: x64-linux-release
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}

      - name: Install host tools
        run: |
          sudo apt update
          sudo apt install \
            autoconf automake autoconf-archive build-essential curl git libgl1-mesa-dev libglu1-mesa-dev \
            libltdl-dev libtool libx11-dev libx11-xcb-dev libxcb1-dev libxcb-glx0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render0-dev libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxcb-xkb-dev libxext-dev libxfixes-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxrender-dev libxtst-dev cmake ninja-build pkg-config python3 tar unzip zip

      - name: Setup vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --force "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vcpkg/vcpkg" version

      - name: Configure vcpkg triplet overlay
        run: |
          mkdir -p "${{ github.workspace }}/triplets_overlay"
          cat > "${{ github.workspace }}/triplets_overlay/${{ matrix.vcpkg_triplet }}.cmake" <<EOF
          set(VCPKG_TARGET_ARCHITECTURE ${{ matrix.vcpkg_arch }})
          set(VCPKG_CMAKE_SYSTEM_NAME Linux)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_BUILD_TYPE release)
          EOF

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ matrix.qbt_gui }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/**', 'triplets_overlay/*.cmake', '.github/workflows/ci_ubuntu.yaml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ matrix.qbt_gui }}-${{ env.VCPKG_COMMIT }}-
            vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-

      - name: Install dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="${{ github.workspace }}" \
            --triplet=${{ matrix.vcpkg_triplet }} \
            --host-triplet=${{ matrix.vcpkg_triplet }} \
            --overlay-ports="${{ github.workspace }}/vcpkg" \
            --overlay-triplets="${{ github.workspace }}/triplets_overlay" \
            --clean-after-build

      - name: Build qBittorrent
        run: |
          cmake \
            -B build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_MODE=ON \
            -DVCPKG_MANIFEST_DIR="${{ github.workspace }}" \
            -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/vcpkg" \
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/triplets_overlay" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DVCPKG_HOST_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -D${{ matrix.qbt_gui }} \
            -DVERBOSE_CONFIGURE=ON \
            --graphviz=build/target_graph.dot
          cmake --build build

      - name: Install qBittorrent
        run: sudo cmake --install build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: qBittorrent-CI_ubuntu-22.04-x64_${{ matrix.qbt_gui }}
          path: |
            build/compile_commands.json
            build/install_manifest.txt
            build/target_graph.dot
            build/qbittorrent
            build/qbittorrent-nox
