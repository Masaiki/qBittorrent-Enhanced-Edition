name: CI - WebUI

on: [pull_request, push]

jobs:
  ci:
    name: Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/webui/www

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          package-manager-cache: false

      - name: Install tools
        run: npm install

      - name: Lint code
        run: npm run lint

      - name: Format code
        run: |
          npm run format
          git diff --exit-code
