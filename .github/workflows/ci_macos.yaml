name: CI - macOS
on: [pull_request, push]

jobs:
  ci:
    strategy:
      matrix:
        include:
          - arch: x86
            target_arch: x86_64
            os: macos-14
            libt_version: "v1.2.20"
            qbt_gui: "GUI=ON"
          - arch: arm
            target_arch: arm64
            os: macos-14
            libt_version: "v1.2.20"
            qbt_gui: "GUI=ON"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: macOS ${{ matrix.arch }} Build

    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      QT_VERSION: "5.15.18"
      OPENSSL_VERSION: "1.1.1w"
      BOOST_VERSION: "1.86.0"
      DEPS_PREFIX: "${{ github.workspace }}/../macos-deps-${{ matrix.target_arch }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.target_arch }}

      - name: Install host tools
        run: |
          brew update > /dev/null
          brew install \
            cmake ninja ccache pkgconf

      - name: Cache source-built dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: macos-${{ matrix.target_arch }}-qt-${{ env.QT_VERSION }}-openssl-${{ env.OPENSSL_VERSION }}-boost-${{ env.BOOST_VERSION }}-libtorrent-${{ matrix.libt_version }}-${{ hashFiles('.github/workflows/build_macos_deps.sh') }}

      - name: Build dependencies
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
          LIBTORRENT_VERSION: ${{ matrix.libt_version }}
          BUILD_ROOT: ${{ runner.temp }}/macos-deps-build-${{ matrix.target_arch }}
        run: .github/workflows/build_macos_deps.sh

      - name: Build qBittorrent
        run: |
          cmake \
            -B build-${{ matrix.target_arch }} \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.target_arch }}" \
            -DCMAKE_IGNORE_PREFIX_PATH="$CMAKE_IGNORE_PREFIX_PATH" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -D${{ matrix.qbt_gui }} \
            -DBOOST_ROOT="$BOOST_ROOT" \
            -DBoost_ROOT="$BOOST_ROOT" \
            -DVERBOSE_CONFIGURE=ON \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_ROOT_DIR/include" \
            -DOPENSSL_SSL_LIBRARY="$OPENSSL_ROOT_DIR/lib/libssl.dylib" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_ROOT_DIR/lib/libcrypto.dylib" \
            -DQt5_DIR="$QT_ROOT/lib/cmake/Qt5"
          cmake --build build-${{ matrix.target_arch }}

      - name: Prepare build artifacts
        run: |
          appName="qbittorrent"
          if [ "${{ matrix.qbt_gui }}" = "GUI=OFF" ]; then
            appName="qbittorrent-nox"
          fi

          pushd build-${{ matrix.target_arch }}
          "$QT_ROOT/bin/macdeployqt" "$appName.app" -dmg -no-strip
          popd

          mkdir upload
          cp "build-${{ matrix.target_arch }}/$appName.dmg" upload
          mkdir upload/cmake
          cp build-${{ matrix.target_arch }}/compile_commands.json upload/cmake
          mkdir upload/cmake/libtorrent
          cp libtorrent/build-${{ matrix.target_arch }}/compile_commands.json upload/cmake/libtorrent

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: qBittorrent-CI_macOS_${{ matrix.qbt_gui }}_libtorrent-${{ matrix.libt_version }}_${{ matrix.arch }}
          path: upload
