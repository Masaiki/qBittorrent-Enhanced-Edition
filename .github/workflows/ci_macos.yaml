name: CI - macOS
on: [pull_request, push]

env:
  VCPKG_COMMIT: 84bab45d415d22042bd0b9081aea57f362da3f35 # 2025.12.12, Qt 5.15.18
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives

jobs:
  ci:
    strategy:
      matrix:
        include:
          - arch: x86
            target_arch: x86_64
            vcpkg_arch: x64
            vcpkg_triplet: x64-osx-release
            os: macos-14
            qbt_gui: "GUI=ON"
          - arch: arm
            target_arch: arm64
            vcpkg_arch: arm64
            vcpkg_triplet: arm64-osx-release
            os: macos-14
            qbt_gui: "GUI=ON"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: macOS ${{ matrix.arch }} Build

    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.target_arch }}

      - name: Install host tools
        run: |
          brew update > /dev/null
          brew install \
            autoconf autoconf-archive automake cmake libtool ninja ccache pkgconf

      - name: Setup vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --force "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vcpkg/vcpkg" version

      - name: Configure vcpkg triplet overlay
        run: |
          mkdir -p "${{ github.workspace }}/triplets_overlay"
          cat > "${{ github.workspace }}/triplets_overlay/${{ matrix.vcpkg_triplet }}.cmake" <<EOF
          set(VCPKG_TARGET_ARCHITECTURE ${{ matrix.vcpkg_arch }})
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_CMAKE_SYSTEM_NAME Darwin)
          set(VCPKG_OSX_ARCHITECTURES ${{ matrix.target_arch }})
          set(VCPKG_OSX_DEPLOYMENT_TARGET 11.0)
          set(VCPKG_BUILD_TYPE release)
          EOF

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg/**', 'triplets_overlay/*.cmake', '.github/workflows/ci_macos.yaml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ env.VCPKG_COMMIT }}-
            vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-

      - name: Install dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="${{ github.workspace }}" \
            --triplet=${{ matrix.vcpkg_triplet }} \
            --host-triplet=${{ matrix.vcpkg_triplet }} \
            --overlay-ports="${{ github.workspace }}/vcpkg" \
            --overlay-triplets="${{ github.workspace }}/triplets_overlay" \
            --clean-after-build

      - name: Build qBittorrent
        run: |
          cmake \
            -B build-${{ matrix.target_arch }} \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.target_arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_MODE=ON \
            -DVCPKG_MANIFEST_DIR="${{ github.workspace }}" \
            -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/vcpkg" \
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/triplets_overlay" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DVCPKG_HOST_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -D${{ matrix.qbt_gui }} \
            -DVERBOSE_CONFIGURE=ON
          cmake --build build-${{ matrix.target_arch }}

      - name: Prepare build artifacts
        run: |
          appName="qbittorrent"
          if [ "${{ matrix.qbt_gui }}" = "GUI=OFF" ]; then
            appName="qbittorrent-nox"
          fi

          pushd build-${{ matrix.target_arch }}
          "${{ github.workspace }}/vcpkg_installed/${{ matrix.vcpkg_triplet }}/tools/qt5/bin/macdeployqt" "$appName.app" -no-strip
          codesign --force --deep --sign - "$appName.app"
          codesign --verify --deep --strict --verbose=2 "$appName.app"
          hdiutil create -volname "$appName" -srcfolder "$appName.app" -ov -format UDZO "$appName.dmg"
          popd

          mkdir upload
          cp "build-${{ matrix.target_arch }}/$appName.dmg" upload
          mkdir upload/cmake
          cp build-${{ matrix.target_arch }}/compile_commands.json upload/cmake

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: qBittorrent-CI_macOS_${{ matrix.qbt_gui }}_${{ matrix.arch }}
          path: upload
